stages:
  - test
  - build
  - deploy
  - release

default:
  tags:
    - docker

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go-cache

.go-cache: &go-cache
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/
      - .go-cache/
    fallback_keys:
      - go-develop

# Format-Check, Vet und Tests mit Race-Detector und Coverage (SQLite).
test:
  stage: test
  image: golang:1.26
  <<: *go-cache
  script:
    # Nur getrackte Dateien prüfen — der Go-Cache liegt als .go/ im Projektverzeichnis.
    - FILES=$(git ls-files '*.go'); test -z "$(gofmt -l $FILES)" || { echo "Nicht gofmt-konform:"; gofmt -l $FILES; exit 1; }
    - go vet ./...
    - go test -race -coverprofile=coverage.txt -covermode=atomic ./...
    - go tool cover -func=coverage.txt | tail -n 1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Identische Verhaltenssuite gegen PostgreSQL (Verhaltensgleichheit, Phase 4).
test-postgres:
  stage: test
  image: golang:1.26
  <<: *go-cache
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: orm
    POSTGRES_PASSWORD: orm
    POSTGRES_DB: orm
    ORMPP_TEST_BACKEND: postgres
    ORMPP_TEST_DSN: postgres://orm:orm@postgres:5432/orm
  script:
    - go test -race ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Identische Verhaltenssuite gegen YugabyteDB (YSQL).
#
# YugabyteDB ist deutlich langsamer als PostgreSQL — jede DDL laeuft ueber
# den Konsens des Einzelknotens. Die Suite braucht hier ein Vielfaches der
# Postgres-Laufzeit, deshalb ein eigener Job-Timeout und ein passender
# -timeout fuer `go test` (dessen Default sind ebenfalls 10 Minuten, sonst
# bricht die Suite von innen ab, bevor der Job-Timeout greift).
test-yugabyte:
  stage: test
  image: golang:1.26
  timeout: 40m
  <<: *go-cache
  services:
    - name: yugabytedb/yugabyte:2025.2.4.0-b122
      alias: yugabyte
      command: ["bin/yugabyted", "start", "--background=false"]
  variables:
    ORMPP_TEST_BACKEND: yugabyte
    ORMPP_TEST_DSN: postgres://yugabyte@yugabyte:5433/yugabyte
  script:
    # Warten, bis YSQL antwortet (yugabyted braucht nach dem Start etwas).
    - for i in $(seq 1 90); do (echo > /dev/tcp/yugabyte/5433) 2>/dev/null && break; sleep 2; done
    - go test -race -timeout 35m ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# golangci-lint wird per `go install` mit derselben Go-Version gebaut wie das
# Projekt (fertige Images hinken der Toolchain hinter); der Modul-Cache macht
# das nach dem ersten Lauf günstig.
lint:
  stage: test
  image: golang:1.26
  <<: *go-cache
  script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
    - $GOPATH/bin/golangci-lint run --timeout 5m ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Dokumentation: Markdown unter docs/ wird vom zentralen Builder-Image
# (techeve/docs-builder) gebaut und per SFTP ausgeliefert. Das Repo enthaelt
# bewusst keine Astro-/Node-Konfiguration — `docs-build` ist ein Kommando im
# Image. DOCS_URL liegt als (geschuetzte) Projektvariable, die
# SFTP-Zugangsdaten (DOC_SFTP_*) als Gruppenvariablen unter techeve.
docs-build:
  stage: build
  image: registry.techeve.de/techeve/docs-builder:starlight-0.41.3
  tags:
    - docker
  # Markdown haengt nicht von der Go-Testsuite ab — ohne needs: [] wuerde ein
  # flakiger Datenbanktest die Veroeffentlichung der Doku verhindern.
  needs: []
  variables:
    DOCS_TITLE: "ORM++"
    DOCS_REPO: "https://gitlab.techeve.de/orm-plus-plus/orm-plus-plus"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docs-build
  artifacts:
    paths:
      - public

# Auslieferung per SFTP statt per FTP: verschluesselter Transport, und der
# ProFTPD am Ziel meldete in der PASV-Antwort eine falsche Adresse, worauf
# lftp bis zum Job-Timeout haengen blieb.
#
# `docs-deploy` aus dem Image kann nur FTP; das Image wird zentral gepflegt
# und hier nicht angefasst. Deshalb der repo-eigene Weg ueber
# scripts/docs-deploy-sftp.sh — verhaltensgleich zum Original (Abgleich statt
# Voll-Upload, Schutz vor nicht eingesperrten Konten), nur anderer Transport.
# Sobald das Builder-Image SFTP beherrscht, faellt beides hier weg.
#
# openssh-client/sshpass fehlen im Image: lftp spricht sftp:// ueber ein
# externes ssh, und das Passwort kommt per sshpass -e aus der Umgebung
# (nicht per -p, sonst stuende es in der Prozessliste des Runners).
docs-deploy:
  stage: deploy
  image: registry.techeve.de/techeve/docs-builder:starlight-0.41.3
  tags:
    - docker
  needs:
    - docs-build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client sshpass
  script:
    - ./scripts/docs-deploy-sftp.sh

# Performance-Benchmark auf dem Runner (konstante Hardware) — MANUELL
# startbar (Play-Button), blockiert die Pipeline nicht. Artefakte:
# report.json (strukturiert) und bench.txt (Go-Benchmark-Format) —
# Läufe vergleichen mit: benchstat alt/bench.txt neu/bench.txt
bench:
  stage: test
  image: golang:1.26
  <<: *go-cache
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: yugabytedb/yugabyte:2025.2.4.0-b122
      alias: yugabyte
      command: ["bin/yugabyted", "start", "--background=false"]
  variables:
    POSTGRES_USER: orm
    POSTGRES_PASSWORD: orm
    POSTGRES_DB: orm
  script:
    # Warten, bis YSQL antwortet (yugabyted braucht nach dem Start etwas).
    - for i in $(seq 1 90); do (echo > /dev/tcp/yugabyte/5433) 2>/dev/null && break; sleep 2; done
    - go run ./examples/bench -scale 300 -postgres "postgres://orm:orm@postgres:5432/orm" -yugabyte "postgres://yugabyte@yugabyte:5433/yugabyte" -out report.json -bench bench.txt
  artifacts:
    paths:
      - report.json
      - bench.txt
    expire_in: 6 mos
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# Prüft auf Branches/MRs, dass der Changelog aus den Conventional Commits
# generierbar ist (schlägt bei kaputter cliff.toml fehl).
changelog-check:
  stage: test
  image:
    name: orhunp/git-cliff:latest
    entrypoint: [""]
  script:
    - git-cliff --unreleased --strip all || true
    - git-cliff --context > /dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Bei einem Versions-Tag (v*) wird der Changelog aus den Commits generiert
# und ein GitLab-Release mit den Release-Notes des Tags erstellt.
changelog:
  stage: release
  image:
    name: orhunp/git-cliff:latest
    entrypoint: [""]
  script:
    - git-cliff --latest --strip header -o release-notes.md
    - git-cliff -o CHANGELOG.md
  artifacts:
    paths:
      - CHANGELOG.md
      - release-notes.md
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["changelog", "test", "lint"]
  script:
    - echo "Erstelle Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "ORM++ $CI_COMMIT_TAG"
    description: release-notes.md
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# git-cliff-Konfiguration — generiert CHANGELOG.md aus Conventional Commits.
# Lokal: `git cliff -o CHANGELOG.md` (Install: brew install git-cliff)
# CI: läuft automatisch bei Versions-Tags (v*), siehe .gitlab-ci.yml.

[changelog]
header = """
# Changelog

Alle nennenswerten Änderungen an ORM++. Generiert aus Conventional Commits mit [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=8, end="") }})
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fehlerbehebungen" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Dokumentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^build|^ci", group = "<!-- 6 -->Build & CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^style", group = "<!-- 7 -->Sonstiges" },
  { body = ".*security", group = "<!-- 8 -->Sicherheit" },
]
